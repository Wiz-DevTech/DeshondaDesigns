# Place in /etc/nginx/sites-available/ on ignited-ciphernex and symlink into
# sites-enabled, then certbot/Cloudflare-origin-cert it the same way you did
# for the other wisdomignited.com subdomains.

server {
    listen 80;
    server_name designsbydeshonda.wisdomignited.com;

    # Static frontend (the single index.html) — deploy via the same SCP
    # workflow you already use for the other HTML deliverables.
    root /var/www/designsbydeshonda;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + uploaded photos proxy to the deshonda-api container
    location /api/ {
        proxy_pass http://127.0.0.1:4010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;   # allow photo uploads
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4010/uploads/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }
}
