name: Deploy DeShonda Designs to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deshonda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static export for Workers Assets)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
        run: npm run build

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install CI script dependencies
        working-directory: scripts
        run: npm ci

      - name: Bootstrap Cloudflare resources (D1 + R2 + wrangler.jsonc)
        working-directory: scripts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ci-bootstrap.mjs

      - name: Apply schema and seed secrets (idempotent)
        working-directory: scripts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.DESHONDA_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.DESHONDA_STRIPE_WEBHOOK_SECRET }}
        run: node ci-seed.mjs

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../wrangler.jsonc

      - name: Show live URLs
        run: |
          echo "Worker deployed. Get the live URL from the deploy step above"
          echo "(https://deshonda-designs.<subdomain>.workers.dev)"
